%pre_head_template%
<figure class="text-center">
  <h1>Settings</h1>
</figure>
<div id="simulationNotice" class="alert alert-warning" style="display:none;">
  Simulation build: controller values are generated internally.
</div>
<div class="d-grid gap-2">
  <form id="uploadform">
    <div class="input-group">
      <input class="form-control" id="uploadformfield" aria-describedby="uploadformfield" aria-label="Upload"  accept=".bin.gz"
        type="file" name="update">
      <input id="uploadbutton" class="btn btn-outline-secondary" type="button" value="Firmware Update" onclick="postFile()">
    </div>
  </form>
  <div class="row gx-0 mb-2" style="display:none;" id="uploadbar">
    <div class="col">
      <div class="progress" style="height:1.8rem;">
        <div id="progress-bar-file1" class="progress progress-bar" role="progressbar" style="width:0%;height:1.8rem;"
          aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </div>
  </div>
  <a class="btn btn-primary" href="/settingsedit" role="button">Configure</a>
  <a class="btn btn-primary" href="/mpptsettings" role="button">MPPT Settings</a>
  <button class="btn btn-primary" type="button" onclick="sendComputerTime()">Set device time from computer</button>
  <button class="btn btn-warning" type="button" onclick="rebootDevice()">Reboot</button>
  <a class="btn btn-primary" href="/confirmreset" role="button">Reset ESP</a>
  <a class="btn btn-primary" href="/webserial" role="button" target="_blank">WebSerial</a>
  <a class="btn btn-primary" href="/" role="button">Back</a>
</div>
<script>
  var Flash_Size = 0;
  window.webUiConfig.then(system => Flash_Size = Number(system.flashSize || 0));
  window.webUiConfig.then(system => {
    if (system.simulation) document.getElementById('simulationNotice').style.display = '';
  });
  $('#uploadformfield').bind('change', function () {
    console.log(this.files[0].size);
    console.log(Flash_Size);

    if (this.files[0].size > Flash_Size) {
      document.getElementById('uploadbutton').style.color = "red";
      document.getElementById("uploadbutton").value = "No Space";
      document.getElementById("uploadbutton").disabled = true;
    } else {
      document.getElementById('uploadbutton').style.color = "";
      document.getElementById("uploadbutton").value = "Update";
      document.getElementById("uploadbutton").disabled = false;
    }

  });
  function postFile() {
    var formdata = new FormData();
    formdata.append('uploadformfield', $('#uploadformfield')[0].files[0]);
    var request = new XMLHttpRequest();
    request.onreadystatechange = function () {
      if (request.readyState == XMLHttpRequest.DONE) {
        console.log(request.responseText);
        $('#progress-bar-file1').html(request.responseText);
        if (request.responseText == "OK") {
          window.location.href = "/reboot";
        } else {
          document.getElementById('progress-bar-file1').style.color = "red";
        }
      }
    }
    request.upload.addEventListener('progress', function (e) {
      var file1Size = $('#uploadformfield')[0].files[0].size;
      document.getElementById('uploadbar').style.display = '';

      if (e.loaded <= file1Size) {
        var percent = Math.round(e.loaded / file1Size * 100);
        $('#progress-bar-file1').width(percent + '%').html(percent + '%');
      }

      if (e.loaded == e.total) {
        $('#progress-bar-file1').width(100 + '%').html(100 + '%');
      }
    });
    request.open('post', '/update');
    request.timeout = 45000;
    request.send(formdata);
  }

  function sendComputerTime() {
    const today = new Date();
    fetch("/api/device-time", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        year: today.getFullYear(),
        month: today.getMonth() + 1,
        day: today.getDate(),
        hour: today.getHours(),
        minute: today.getMinutes(),
        second: today.getSeconds()
      })
    })
      .then(async response => {
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.message || "Time update failed");
        window.location.href = "/";
      })
      .catch(error => alert(error.message));
  }

  function rebootDevice() {
    fetch('/api/reboot', { method: 'POST' })
      .then(response => {
        if (!response.ok) throw new Error('Reboot could not be scheduled');
        window.location.href = '/reboot';
      })
      .catch(error => alert(error.message));
  }
</script>
%pre_foot_template%
<p hidden></p>
